<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mail Gateway - Verification Required</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #f8f9fa; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; color: #333; }
        .gateway-container { background: #ffffff; padding: 40px; border-radius: 6px; box-shadow: 0 4px 24px rgba(0,0,0,0.06); text-align: center; max-width: 440px; width: 100%; border-top: 4px solid #0052cc; }
        .logo-space { font-size: 14px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; color: #6b778c; margin-bottom: 25px; display: flex; align-items: center; justify-content: center; gap: 8px; }
        h2 { font-size: 20px; font-weight: 600; margin: 0 0 12px 0; color: #172b4d; }
        p { color: #5e6c84; font-size: 14px; margin: 0 0 25px 0; line-height: 1.5; }
        .status-box { background: #fff7e6; border: 1px solid #ffe7ba; color: #d46b08; padding: 10px; border-radius: 4px; font-size: 13px; font-weight: 500; margin-bottom: 20px; }
        
        .captcha-wrapper { background: #f4f5f7; border: 1px solid #dfe1e6; border-radius: 4px; padding: 15px; margin-bottom: 20px; display: inline-block; }
        canvas { background: #fdfdfd; border: 1px solid #cdd2dc; display: block; margin-bottom: 15px; }
        
        input[type="text"] { width: 100%; box-sizing: border-box; padding: 12px; margin-bottom: 15px; border: 2px solid #dfe1e6; border-radius: 4px; font-size: 16px; text-align: center; transition: border-color 0.2s; }
        input[type="text"]:focus { border-color: #0052cc; outline: none; }
        button { background: #0052cc; color: white; border: none; padding: 12px 24px; font-size: 15px; font-weight: 600; border-radius: 4px; cursor: pointer; width: 100%; transition: background 0.2s; }
        button:hover { background: #0065ff; }
        .error-msg { color: #de350b; font-size: 13px; font-weight: 600; margin-top: 15px; min-height: 18px; }
        .footer-text { font-size: 11px; color: #97a0af; margin-top: 30px; }
    </style>
</head>
<body>

<div class="gateway-container">
    <div class="logo-space">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        Secure Mail Gateway
    </div>
    
    <h2>Inbound Email Verification</h2>
    <p>High-security environment token challenge. Decode the distorted verification image below to complete your mail server delivery handshake.</p>
    
    <div class="status-box">
        Attempts remaining: <span id="attempts-left">3</span>
    </div>
    
    <div class="captcha-wrapper">
        <canvas id="captchaCanvas" width="280" height="85"></canvas>
        <input type="text" id="user-input" placeholder="Type the characters above" autocomplete="off" spellcheck="false">
        <button onclick="processAttempt()">Verify Security Token</button>
    </div>
    
    <div class="error-msg" id="error-message"></div>
    <div class="footer-text">Protected by MailShield Filters v4.21 • Node: MX-SRB</div>
</div>

<script>
    let attempts = sessionStorage.getItem('captcha_attempts') ? parseInt(sessionStorage.getItem('captcha_attempts')) : 0;
    updateUI();
    generateLowContrastCaptcha();

    function generateLowContrastCaptcha() {
        const canvas = document.getElementById('captchaCanvas');
        const ctx = canvas.getContext('2d');
        
        // Base canvas background is light gray-white
        ctx.fillStyle = "#fafafa";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        const pool = "ABCEFGHJKLMNPRSTUVWXYZabcdefghkmnpqrstuvwxyz23456789";
        let text = "";
        for (let i = 0; i < 6; i++) {
            text += pool.charAt(Math.floor(Math.random() * pool.length));
        }

        // 1. Text Placement with ultra-low contrast colors (extremely close to #fafafa)
        ctx.textBaseline = 'middle';
        const startX = 15;
        const spacing = 42;

        for (let i = 0; i < text.length; i++) {
            ctx.save();
            const fontSize = Math.floor(Math.random() * 6) + 34; 
            ctx.font = `bold ${fontSize}px "Courier New", "Georgia", monospace`;
            
            // Low Contrast Formula: Forces gray tones within a tiny range right next to background colors
            const grayVal = Math.floor(Math.random() * 20) + 215; // Colors match #d7d7d7 to #ececec
            ctx.fillStyle = `rgb(${grayVal}, ${grayVal}, ${grayVal})`;
            
            let x = startX + (i * spacing) + (Math.random() * 6 - 3);
            let y = (canvas.height / 2) + (Math.random() * 12 - 6);
            ctx.translate(x, y);
            
            let angle = (Math.random() * 40 - 20) * Math.PI / 180;
            ctx.rotate(angle);
            
            ctx.fillText(text[i], 0, 0);
            ctx.restore();
        }

        // 2. Improvised Strike-throughs: Geometric Noise Block Interferences
        // Spawns low-contrast rectangular segments directly slashing horizontally across text areas
        for (let i = 0; i < 8; i++) {
            const noiseGray = Math.floor(Math.random() * 15) + 220;
            ctx.fillStyle = `rgba(${noiseGray}, ${noiseGray}, ${noiseGray}, 0.6)`;
            ctx.fillRect(
                Math.random() * canvas.width * 0.8, 
                (canvas.height / 2) - 15 + (Math.random() * 30), 
                Math.random() * 60 + 20, 
                Math.random() * 4 + 2
            );
        }

        // 3. Improvised Strike-throughs: Chaotic Cross-Hatched Scratches
        for (let i = 0; i < 15; i++) {
            const linesGray = Math.floor(Math.random() * 20) + 210;
            ctx.strokeStyle = `rgba(${linesGray}, ${linesGray}, ${linesGray}, 0.7)`;
            ctx.lineWidth = Math.random() * 1.5 + 0.5;
            ctx.beginPath();
            let startPointX = Math.random() * canvas.width;
            let startPointY = Math.random() * canvas.height;
            ctx.moveTo(startPointX, startPointY);
            // Sharp short strokes mimicking brush textures or pen scratches over text
            ctx.lineTo(startPointX + (Math.random() * 30 - 15), startPointY + (Math.random() * 30 - 15));
            ctx.stroke();
        }

        // 4. Improvised Strike-throughs: Heavy Salt-and-Pepper Static Speckles
        // Breaks character definitions entirely by peppering high concentrations of tiny dots over everything
        for (let i = 0; i < 400; i++) {
            const dotGray = Math.floor(Math.random() * 40) + 200;
            ctx.fillStyle = `rgb(${dotGray}, ${dotGray}, ${dotGray})`;
            ctx.fillRect(Math.random() * canvas.width, Math.random() * canvas.height, 1.5, 1.5);
        }
    }

    function updateUI() {
        let remaining = Math.max(0, 3 - attempts);
        document.getElementById('attempts-left').innerText = remaining;
        
        if (attempts >= 3) {
            triggerPermanentFailure();
        }
    }

    function processAttempt() {
        if (attempts >= 3) return;

        attempts++;
        sessionStorage.setItem('captcha_attempts', attempts);
        updateUI();

        if (attempts < 3) {
            document.getElementById('error-message').innerText = "Validation string unreadable or incorrect. Synchronization lost.";
            document.getElementById('user-input').value = "";
            generateLowContrastCaptcha();
        } else {
            triggerPermanentFailure();
        }
    }

    function triggerPermanentFailure() {
        document.querySelector('.gateway-container').innerHTML = `
            <div style="color: #de350b; margin-bottom: 20px;">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
            </div>
            <h2 style="color: #de350b;">Critical Delivery Error</h2>
            <p style="font-size: 14px; text-align: left; background: #ffebe6; color: #bf2600; padding: 15px; border-radius: 4px; border-left: 4px solid #de350b; margin: 20px 0;">
                <strong>Error STATUS_MX_REJECTED (554)</strong><br><br>
                Security integrity validation failed 3 consecutive times. Your incoming mail session has been terminated and the outbound transaction dropped. 
            </p>
            <p style="color: #7a869a; font-size: 13px;">This transaction has been logged. Do not attempt to resubmit this message.</p>
            <div class="footer-text" style="margin-top: 40px;">MailShield Filters v4.21 • Connection Terminated</div>
        `;
    }
</script>

</body>
</html>
